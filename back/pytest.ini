# 백엔드 테스트 설정. 실행: cd back && .venv/Scripts/python -m pytest
[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
markers =
    integration: 실제 PostgreSQL(ipe 스키마)에 붙는 통합 테스트. 접속 정보가 없으면 건너뛴다.
filterwarnings =
    ignore:Using `httpx` with `starlette\.testclient` is deprecated.*:UserWarning
    ignore:The anyio\.abc\.BlockingPortal alias is deprecated.*:Warning
