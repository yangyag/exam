# 프론트 컨테이너의 nginx — SPA 정적 서빙 + API 프록시.
# 호스트 nginx(yangyag5.duckdns.org, TLS) → 이 컨테이너 80 → /api·/figures 는 back:8092
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # JSON API — 같은 오리진이 되도록 백엔드 컨테이너로 넘긴다(경로 그대로 전달)
    location /api/ {
        proxy_pass http://back:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # 문항 도식 이미지
    location /figures/ {
        proxy_pass http://back:8092;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public";
    }

    # SPA 라우팅 — 없는 경로는 index.html 로 돌린다
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
