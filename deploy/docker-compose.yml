# EC2(/home/ubuntu/exam)에서 도는 구성.
# 이미지는 이 저장소에서 빌드해 tar 로 올린 뒤 docker load 한다(deploy/deploy.sh).
#
#   front: nginx 가 SPA 정적 파일을 서빙하고 /api·/figures 를 back 으로 프록시한다
#          (같은 오리진이라 CORS·쓰기 토큰이 필요 없다)
#   back : uvicorn. DB 는 기존 공용 컨테이너 yangyag-postgres 의 exam 데이터베이스를 쓴다
#          → 공용 네트워크 auto_default 에 함께 붙는다
services:
  back:
    image: exam-back:1.0
    container_name: exam-back
    env_file: .env # EXAM_DB_URL (암호 포함 — 600 권한으로 둔다)
    networks:
      - default
      - auto_default
    mem_limit: 224m
    restart: unless-stopped

  front:
    image: exam-front:1.0
    container_name: exam-front
    depends_on:
      back:
        condition: service_healthy
    ports:
      - "127.0.0.1:8091:80" # 호스트 nginx(yangyag5.duckdns.org)가 여기로 프록시한다
    mem_limit: 64m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null"]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  auto_default:
    external: true
